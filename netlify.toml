[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/vid/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/stills/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
