<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wildlight — extraordinary stays</title>
  <meta name="description" content="Scroll to fly through Wildlight — a continuous cinematic walkthrough of extraordinary vacation homes." />
  <link rel="preload" as="fetch" type="video/mp4" href="assets/vid/cabin-mobile-v4.mp4" media="(max-width: 860px)" crossorigin fetchpriority="high" />
  <style>
    :root, .sw-root {
      --sw-bg: #0B0D10;
      --sw-ink: #E8DFD2;
      --sw-ink-soft: #9AA3AD;
      --sw-accent: #C47A4A;
    }
    body {
      margin: 0;
      background: #0B0D10;
      color: #E8DFD2;
    }
    /* Immersive film mode: video + scroll hint only */
    .sw-topbar,
    .sw-copylayer,
    .sw-route,
    .sw-scrollbar {
      display: none !important;
    }
    .sw-hint {
      color: rgba(232, 223, 210, 0.72) !important;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js?v=film-hq-1"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      nav: false,
      atmosphere: true,
      hint: 'scroll to fly through',
      diveScroll: 1.45,
      diveScrollMobile: 2.05,
      connScroll: 0.9,
      crossfade: 0.1,
      sections: [
        {
          id: 'cabin',
          label: 'Alpine',
          still: 'assets/stills/cabin.webp',
          clip: 'assets/vid/cabin.mp4',
          clipMobile: 'assets/vid/cabin-mobile-v4.mp4',
          accent: '#7A8F7A',
        },
        {
          id: 'beach',
          label: 'Coast',
          still: 'assets/stills/beach.webp',
          clip: 'assets/vid/beach.mp4',
          clipMobile: 'assets/vid/beach-mobile-v4.mp4',
          accent: '#C47A4A',
        },
        {
          id: 'treehouse',
          label: 'Canopy',
          still: 'assets/stills/treehouse.webp',
          clip: 'assets/vid/treehouse.mp4',
          clipMobile: 'assets/vid/treehouse-mobile-v4.mp4',
          accent: '#B8956C',
        },
        {
          id: 'desert',
          label: 'Desert',
          still: 'assets/stills/desert.webp',
          clip: 'assets/vid/desert.mp4',
          clipMobile: 'assets/vid/desert-mobile-v4.mp4',
          accent: '#C47A4A',
        },
        {
          id: 'loft',
          label: 'City',
          still: 'assets/stills/loft.webp',
          clip: 'assets/vid/loft.mp4',
          clipMobile: 'assets/vid/loft-mobile-v4.mp4',
          accent: '#9AA3AD',
        },
      ],
      connectors: [],
    });
  </script>
</body>
</html>
