<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wildlight — extraordinary stays</title>
  <meta name="description" content="Scroll to fly through Wildlight — a continuous cinematic walkthrough of extraordinary vacation homes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root, .sw-root {
      --sw-bg: #0B0D10;
      --sw-ink: #E8DFD2;
      --sw-ink-soft: #9AA3AD;
      --sw-accent: #C47A4A;
    }
    body {
      margin: 0;
      background: #0B0D10;
      color: #E8DFD2;
      font-family: "Outfit", sans-serif;
      font-weight: 300;
    }
    .sw-root .sw-brand,
    .sw-root .sw-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Wildlight', href: '#top' },
      cta: { label: 'Inquire', href: '#loft' },
      hint: 'scroll to fly through',
      diveScroll: 1.45,
      connScroll: 0.9,
      crossfade: 0.08,
      sections: [
        {
          id: 'cabin',
          label: 'Alpine',
          still: 'assets/stills/cabin.webp',
          clip: 'assets/vid/cabin.mp4',
          accent: '#7A8F7A',
          eyebrow: 'Mountain hush',
          title: 'Arrive to the hearth.',
          body: 'Cedar, stone, and a wall of glass facing the ridge — the day slows the moment you cross the threshold.',
          tags: ['Alpine cabin', 'Golden hour', 'Unhurried'],
        },
        {
          id: 'beach',
          label: 'Coast',
          still: 'assets/stills/beach.webp',
          clip: 'assets/vid/beach.mp4',
          accent: '#C47A4A',
          eyebrow: 'Oceanfront',
          title: 'Live beside the horizon.',
          body: 'A pavilion of light and linen, opened fully to salt air and the long line of the shore.',
          tags: ['Ocean villa', 'Floor-to-ceiling glass'],
        },
        {
          id: 'treehouse',
          label: 'Canopy',
          still: 'assets/stills/treehouse.webp',
          clip: 'assets/vid/treehouse.mp4',
          accent: '#B8956C',
          eyebrow: 'Among the trees',
          title: 'Sleep in the canopy.',
          body: 'A suspended suite of timber and quiet — deck rails open to mist, birdsong, and green light.',
          tags: ['Treehouse suite', 'Forest immersion'],
        },
        {
          id: 'desert',
          label: 'Desert',
          still: 'assets/stills/desert.webp',
          clip: 'assets/vid/desert.mp4',
          accent: '#C47A4A',
          eyebrow: 'Warm stone',
          title: 'Courtyard at dusk.',
          body: 'Adobe arches, a still fountain, and the desert sky held in a private square of shade.',
          tags: ['Desert retreat', 'Courtyard'],
        },
        {
          id: 'loft',
          label: 'City',
          still: 'assets/stills/loft.webp',
          clip: 'assets/vid/loft.mp4',
          accent: '#9AA3AD',
          eyebrow: 'And finally',
          title: 'The city, held soft.',
          body: 'A penthouse loft where evening settles against glass — the last light of a journey through extraordinary stays.',
          tags: ['Penthouse', 'Skyline'],
          cta: {
            primary: { label: 'Request a stay', href: '#top' },
            secondary: { label: 'Back to start', href: '#top' },
          },
        },
      ],
      connectors: [],
    });
  </script>
</body>
</html>
